services:
  postgres:
    image: postgres:16-alpine
    container_name: quantara-ai-boq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantara_ai_boq}
      POSTGRES_USER: ${POSTGRES_USER:-quantara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantara_local_password}
    ports:
      - "5432:5432"
    volumes:
      - quantara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  quantara_postgres_data:
