name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quantara_ai_boq_test
          POSTGRES_USER: quantara
          POSTGRES_PASSWORD: quantara_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantara -d quantara_ai_boq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://quantara:quantara_ci_password@localhost:5432/quantara_ai_boq_test?schema=public
      DATABASE_URL: postgresql://quantara:quantara_ci_password@localhost:5432/quantara_ai_boq_test?schema=public
      PROPOSAL_ACCESS_SECRET: ci-only-proposal-secret-with-more-than-thirty-two-bytes
      INTEGRATION_CREDENTIALS_ENCRYPTION_KEY: ci-only-integration-key-with-more-than-thirty-two-bytes
      APP_BASE_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify npm version
        run: test "$(npm --version)" = "11.13.0"

      - name: Clean install
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with isolated PostgreSQL
        run: npm test

      - name: Install Chromium for onboarding acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify first-project onboarding in Chromium
        run: npx playwright test tests/e2e/onboarding-first-project.spec.ts --project=chromium --project="Mobile Chrome"

      - name: Verify mocked Joinery UI workflow in Chromium
        run: npx playwright test tests/e2e/joinery-workspace-mocked.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Build Next.js
        run: npm run build

      - name: Build Cloudflare adapter
        run: npm run build:cloudflare
